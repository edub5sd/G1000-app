<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>G1000 NXi Simulator</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-geosearch@3.0.0/dist/geosearch.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-geosearch@3.0.0/dist/bundle.min.js"></script>

    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
        .cockpit { display: flex; justify-content: center; align-items: center; gap: 10px; height: 100vh; padding: 10px; }
        .bezel { border: 15px solid #1a1a1a; border-radius: 10px; background: #000; position: relative; box-shadow: 0 0 20px #222; }
        canvas, #map { display: block; width: 47vw; height: 38vw; background: #111; }
        
        /* Search Bar */
        #search-container { position: absolute; top: 10px; left: 10px; z-index: 1000; display: flex; background: #000; padding: 5px; border: 1px solid #0f0; border-radius: 5px; }
        #search-input { background: #000; color: #0f0; border: none; padding: 8px; width: 180px; outline: none; font-family: monospace; }
        #search-btn { background: #0f0; color: #000; border: none; padding: 8px 12px; cursor: pointer; font-weight: bold; }

        #master-btn { position: absolute; bottom: 20px; left: 20px; z-index: 1000; padding: 15px; background: #b00; color: white; border: none; border-radius: 5px; font-weight: bold; }
        .online { background: #006400 !important; }
    </style>
</head>
<body>

<button id="master-btn" onclick="engageSystems()">ENGAGE SYSTEMS</button>

<div class="cockpit">
    <div class="bezel">
        <canvas id="pfdCanvas"></canvas>
    </div>
    <div class="bezel">
        <div id="search-container">
            <input type="text" id="search-input" placeholder="SEARCH WAYPOINT...">
            <button id="search-btn" onclick="findLocation()">ENT</button>
        </div>
        <div id="map"></div>
    </div>
</div>

<script>
const sim = { pitch: 0, roll: 0, hdg: 0, alt: 0, spd: 0, lat: 34.05, lon: -118.24 };

// PFD Setup
const pCanvas = document.getElementById('pfdCanvas');
const pctx = pCanvas.getContext('2d');
pCanvas.width = 800; pCanvas.height = 600;

// MFD Map Setup
const map = L.map('map', { zoomControl: false }).setView([sim.lat, sim.lon], 15);
L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png').addTo(map);
let suv = L.circleMarker([sim.lat, sim.lon], { color: '#00ffff', radius: 10, fillOpacity: 1 }).addTo(map);

// FIX: Search Function
const provider = new GeoSearch.OpenStreetMapProvider();
async function findLocation() {
    const query = document.getElementById('search-input').value;
    try {
        const results = await provider.search({ query: query });
        if (results && results.length > 0) {
            const { x, y, label } = results[0];
            L.marker([y, x]).addTo(map).bindPopup(label).openPopup();
            map.flyTo([y, x], 16);
        } else {
            alert("Waypoint not found!");
        }
    } catch (e) {
        console.error(e);
    }
}

function drawPFD() {
    pctx.clearRect(0, 0, 800, 600);

    // Artificial Horizon
    pctx.save();
    pctx.translate(400, 300);
    pctx.rotate(-(sim.roll || 0) * Math.PI / 180);
    pctx.translate(0, (sim.pitch || 0) * 8);

    pctx.fillStyle = "#0072bc"; pctx.fillRect(-1500, -1500, 3000, 1500); // Sky
    pctx.fillStyle = "#734a12"; pctx.fillRect(-1500, 0, 3000, 1500);    // Ground
    
    // Pitch Ladder
    pctx.strokeStyle = "white"; pctx.lineWidth = 2;
    for(let i = -30; i <= 30; i += 5) {
        let y = -i * 15;
        pctx.beginPath();
        pctx.moveTo(i%10===0 ? -60 : -30, y);
        pctx.lineTo(i%10===0 ? 60 : 30, y);
        pctx.stroke();
    }
    pctx.restore();

    // HUD Tapes
    pctx.fillStyle = "rgba(0,0,0,0.6)"; 
    pctx.fillRect(50, 100, 90, 400); // Speed
    pctx.fillRect(660, 100, 90, 400); // Alt
    
    pctx.fillStyle = "white"; pctx.font = "bold 24px Arial";
    pctx.fillText("SPD", 65, 130);
    pctx.fillText(Math.round(sim.spd), 70, 310);
    pctx.fillText("ALT", 675, 130);
    pctx.fillText(Math.round(sim.alt), 680, 310);
}

// FIX: Systems Engagement
function engageSystems() {
    const btn = document.getElementById('master-btn');
    btn.innerText = "SYSTEMS ONLINE";
    btn.classList.add('online');

    // Request GPS
    if (navigator.geolocation) {
        navigator.geolocation.watchPosition((pos) => {
            sim.lat = pos.coords.latitude; 
            sim.lon = pos.coords.longitude;
            sim.spd = (pos.coords.speed || 0) * 1.94;
            sim.alt = (pos.coords.altitude || 0) * 3.28;
            if(pos.coords.heading) sim.hdg = pos.coords.heading;
            
            suv.setLatLng([sim.lat, sim.lon]);
            map.panTo([sim.lat, sim.lon]);
        }, (err) => console.log(err), { enableHighAccuracy: true });
    }

    // Request Orientation (PFD Movement)
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().then(state => {
            if (state === 'granted') window.addEventListener('deviceorientation', handleOrient);
        });
    } else {
        window.addEventListener('deviceorientation', handleOrient);
    }
}

function handleOrient(e) {
    sim.roll = e.gamma;
    sim.pitch = e.beta - 45;
}

function loop() { drawPFD(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
