<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G1000 Mission Control</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { margin: 0; background: #050505; color: #fff; font-family: sans-serif; overflow: hidden; }
        .cockpit-panel { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 20px; 
            height: 100vh; 
            padding: 10px;
        }
        .unit-frame { 
            border: 12px solid #222; 
            border-radius: 8px; 
            background: #111; 
            position: relative; 
            box-shadow: 0 0 30px #000;
        }
        canvas, #mfdMap { 
            display: block; 
            width: 45vw; 
            height: 35vw; 
            background: #000; 
        }
        .bezel-label { 
            position: absolute; top: -10px; left: 50%; transform: translateX(-50%); 
            background: #222; padding: 0 10px; color: #aaa; font-size: 10px; font-weight: bold;
        }
    </style>
</head>
<body>

<div class="cockpit-panel">
    <div class="unit-frame">
        <span class="bezel-label">GARMIN PFD</span>
        <canvas id="pfdCanvas"></canvas>
    </div>

    <div class="unit-frame">
        <span class="bezel-label">GARMIN MFD / MAP</span>
        <div id="mfdMap"></div>
    </div>
</div>

<script>
/**
 * FLIGHT & TELEMETRY SYSTEM
 */
const state = {
    pitch: 0, roll: 0, hdg: 0,
    alt: 0, speed: 0, lat: 34.0522, lon: -118.2437
};

// 1. Initialize PFD
const pCanvas = document.getElementById('pfdCanvas');
const pctx = pCanvas.getContext('2d');
pCanvas.width = 600; pCanvas.height = 450;

// 2. Initialize MFD Map
const map = L.map('mfdMap', { zoomControl: false }).setView([state.lat, state.lon], 16);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
let suvMarker = L.circleMarker([state.lat, state.lon], { color: 'cyan', radius: 8 }).addTo(map);

/**
 * PFD DRAWING LOGIC
 */
function drawPFD() {
    pctx.clearRect(0, 0, 600, 450);

    // Artificial Horizon
    pctx.save();
    pctx.translate(300, 225);
    pctx.rotate(-state.roll * Math.PI / 180);
    pctx.translate(0, state.pitch * 5);
    pctx.fillStyle = "#0072bc"; pctx.fillRect(-1000, -1000, 2000, 1000); // Sky
    pctx.fillStyle = "#734a12"; pctx.fillRect(-1000, 0, 2000, 1000);    // Ground
    pctx.restore();

    // Altitude & Speed Readouts
    pctx.fillStyle = "rgba(0,0,0,0.7)";
    pctx.fillRect(10, 190, 80, 70); // Speed box
    pctx.fillRect(510, 190, 80, 70); // Alt box
    
    pctx.fillStyle = "white"; pctx.font = "bold 20px Arial";
    pctx.fillText("SPD: " + Math.round(state.speed), 15, 230);
    pctx.fillText("ALT: " + Math.round(state.alt), 515, 230);
}

/**
 * TELEMETRY UPDATER
 */
function startGPS() {
    if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition((pos) => {
            state.lat = pos.coords.latitude;
            state.lon = pos.coords.longitude;
            state.speed = (pos.coords.speed || 0) * 1.94; // M/S to Knots
            state.alt = (pos.coords.altitude || 0) * 3.28; // Meters to Feet
            if (pos.coords.heading) state.hdg = pos.coords.heading;

            // Sync the Map
            map.panTo([state.lat, state.lon]);
            suvMarker.setLatLng([state.lat, state.lon]);
        }, null, { enableHighAccuracy: true });
    }
}

// Main Animation Loop
function mainLoop() {
    drawPFD();
    requestAnimationFrame(mainLoop);
}

startGPS();
mainLoop();
</script>
</body>
</html>
